<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="doc_title">آرش صالحیان | مهندسی کامپیوتر و توسعه نرم‌افزار</title>
  <meta name="description" content="وب‌سایت شخصی و پورتفولیو آرش صالحیان، دانشجوی مهندسی کامپیوتر دانشگاه کردستان، توسعه‌دهنده نرم‌افزار و خالق سامانه نوین حساب." />
  <meta name="keywords" content="آرش صالحیان, Arash Salehian, رزومه, مهندسی کامپیوتر, نوین حساب, پایتون, جاوا, سی پلاس پلاس, جنگو, توسعه نرم‌افزار" />
  <meta name="author" content="Arash Salehian" />

  {{> head-extras}}
</head>
<body class="bg-surface text-foreground font-fa antialiased selection:bg-cyan-500/20 selection:text-cyan-300 min-h-screen relative flex flex-col justify-between">

  {{> background}}

  {{> navbar}}

  <main class="relative z-10 flex-grow">
    {{> hero}}
    {{> about}}
    {{> experience}}
    {{> skills}}
    {{> projects}}
    {{> demo/demo-shell}}
    {{> contact}}
  </main>

  {{> footer}}

  <!-- Interactive Cursor Follower Aura -->
  <div id="cursorFollower" class="cursor-follower" aria-hidden="true"></div>

  <!-- Site-wide Lightweight Toast Component -->
  <div id="siteToast" role="status" aria-live="polite"></div>

  <!-- JavaScript Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
